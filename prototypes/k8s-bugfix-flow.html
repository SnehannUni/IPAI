<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bugfix: Doppelte Antworten</title>
<style>
:root{
  --bg:#ffffff; --soft:#fafafa; --line:#e4e4e7; --line2:#d4d4d8; --text:#18181b; --muted:#71717a; --faint:#a1a1aa;
  --trigger:#d97706; --step:#2563eb; --store:#059669; --external:#7c3aed; --error:#dc2626; --ok:#059669;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:32px 20px 40px}

.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
button{background:#fff;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:var(--soft);border-color:var(--line2)}
button.primary{background:var(--text);border-color:var(--text);color:#fff;min-width:96px}
button.primary:hover{background:#27272a}
.gap{width:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--soft);color:var(--text);font-weight:500}
.seg.big button{padding:7px 20px;font-size:14px}
#view button[data-v="bug"].on{color:var(--error)}
#view button[data-v="fix"].on{color:var(--ok)}
.right{margin-left:auto}

/* Kopf: ein Satz + Kette, die sich beim Abspielen füllt */
.banner{border-radius:10px;padding:14px 18px;margin-bottom:14px}
.banner .head{font-size:15px}
.banner .head b{font-weight:600}
.banner.bug{background:#fef2f2}.banner.bug .head b{color:#b91c1c}
.banner.fix{background:#ecfdf5}.banner.fix .head b{color:#047857}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.chain .c{font-size:12.5px;padding:3px 10px;border-radius:99px;border:1px solid transparent;background:#fff;color:var(--faint);transition:all .3s}
.chain .arr{color:var(--faint);font-size:12px}
.banner.bug .chain .c.on{color:#991b1b;border-color:#fca5a5}
.banner.fix .chain .c.on{color:#065f46;border-color:#6ee7b7}
.banner.bug .chain .c.cur{background:var(--error);border-color:var(--error);color:#fff}
.banner.fix .chain .c.cur{background:var(--ok);border-color:var(--ok);color:#fff}

.stage-outer{position:relative;width:100%}
.stage{position:absolute;top:0;left:0;width:1200px;height:440px;transform-origin:0 0;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stage svg{position:absolute;inset:0;overflow:visible}
.stage svg.overlay{pointer-events:none;z-index:3}

.zone-cap{font-size:11px;font-weight:600;letter-spacing:.08em;fill:var(--text)}
.zone-div{stroke:var(--line);stroke-width:1}

.edge{fill:none;stroke:var(--line2);stroke-width:1.5;transition:stroke .3s}
.edge.async{stroke-dasharray:5 5}
.edge.done{stroke:var(--faint)}
.edge.active{stroke:var(--text)}
.edge.async.active{animation:march .8s linear infinite}
.edge.new.done{stroke:#6ee7b7}
.edge.new.active{stroke:var(--ok)}
.edge.err.done{stroke:#fca5a5}
.edge.err.active{stroke:var(--error)}
@keyframes march{to{stroke-dashoffset:-10}}
.elab rect{fill:#fff}
.elab text{fill:var(--faint);font-size:11.5px;transition:fill .3s}
.elab.done text{fill:var(--muted)}
.elab.active text{fill:var(--text);font-weight:600}
.elab.new text{fill:var(--ok)}
.elab.err.active text{fill:var(--error)}

.node{position:absolute;display:flex;flex-direction:column;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.3;transition:border-color .3s,box-shadow .3s,background .3s}
.node>*{flex-shrink:0}
.node.active{border-color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.06)}
.node.dead{border-color:#fca5a5;background:#fef2f2}
.node.off{background:var(--soft)}
.node .type{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.node .type::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.node .label{font-weight:600;font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .sub{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .dyn{margin-top:auto;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.node .badge{position:absolute;top:9px;right:10px;font-size:10.5px;font-weight:600;color:var(--muted);background:#f4f4f5;border-radius:4px;padding:0 6px}
.bad{color:var(--error);font-weight:600}
.okc{color:var(--ok);font-weight:600}
.hl{color:var(--text);font-weight:600}
.pill{font-size:10.5px;font-weight:600;padding:0 6px;border-radius:4px}
.pill.neu{background:#ecfdf5;color:#047857}.pill.mod{background:#eff6ff;color:#1d4ed8}
.slot{display:inline-block;width:14px;height:10px;border-radius:2px;background:var(--text);margin-right:6px;vertical-align:-1px;animation:pop .3s ease-out}
.slot.out{background:transparent;border:1.5px dashed var(--text)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* Aufgabenliste des Bearbeiters: zeigt, was erledigt ist und was fehlt */
.tasks{display:grid;gap:1px;margin-top:6px}
.task{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--faint);white-space:nowrap}
.task i{font-style:normal;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:9px;line-height:1}
.task.ok{color:var(--text)}
.task.ok i{background:var(--text);border-color:var(--text);color:#fff}
.task.fail{color:var(--error);font-weight:600}
.task.fail i{background:var(--error);border-color:var(--error);color:#fff}
.task.okg{color:var(--ok);font-weight:600}
.task.okg i{background:var(--ok);border-color:var(--ok);color:#fff}

.node.you .dyn{flex:1;min-height:0;white-space:normal;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;margin-top:8px}
.bub{max-width:88%;padding:6px 10px;border-radius:8px;font-size:12.5px;line-height:1.4;color:var(--text);animation:pop .25s ease-out}
.bub.me{align-self:flex-end;background:#f4f4f5}
.bub.ai{align-self:flex-start;border:1px solid var(--line)}
.bub.dup{border-color:var(--error);background:#fef2f2}
.bub small{display:block;color:var(--error);font-size:10.5px;font-weight:600;margin-top:2px}
.node.you.good{border-color:var(--ok);box-shadow:0 0 0 3px #ecfdf5}

.card{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:16px 20px;min-height:92px}
.card .no{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.card .big{font-size:18px;font-weight:500;margin-top:4px;letter-spacing:-.01em}
.card.err .big{color:#b91c1c}

.timeline{display:flex;gap:4px;align-items:center;margin-top:14px}
.tl{width:26px;height:26px;border-radius:50%;padding:0;font-size:11.5px;color:var(--faint);display:grid;place-items:center}
.tl.done{color:var(--text)}
.tl.cur{background:var(--text);border-color:var(--text);color:#fff}
.tl.err{border-color:#fecaca}
.tl.err.cur{background:var(--error);border-color:var(--error)}
.tl-line{flex:0 0 8px;height:1px;background:var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <div class="controls">
    <div class="seg big" id="view"><button data-v="bug" class="on">Bug</button><button data-v="fix">Lösung</button></div>
    <span class="gap"></span>
    <button class="primary" id="play">Abspielen</button>
    <button id="prev">Zurück</button>
    <button id="next">Weiter</button>
    <div class="seg right" id="mode"><button data-m="0" class="on">Einfach</button><button data-m="1">Technisch</button></div>
  </div>

  <div class="banner" id="banner"><div class="head" id="head"></div><div class="chain" id="chain"></div></div>

  <div class="stage-outer" id="outer">
    <div class="stage" id="stage">
      <svg width="1200" height="440" viewBox="0 0 1200 440">
        <defs>
          <marker id="m-idle"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#d4d4d8"/></marker>
          <marker id="m-done"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a1a1aa"/></marker>
          <marker id="m-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#18181b"/></marker>
          <marker id="m-err"    viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#dc2626"/></marker>
          <marker id="m-errdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#fca5a5"/></marker>
          <marker id="m-new"    viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#059669"/></marker>
          <marker id="m-newdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6ee7b7"/></marker>
        </defs>
        <rect x="0" y="0" width="300" height="440" fill="#fafafa"/>
        <rect x="900" y="0" width="300" height="440" fill="#fafafa"/>
        <line class="zone-div" x1="300" y1="0" x2="300" y2="440"/>
        <line class="zone-div" x1="900" y1="0" x2="900" y2="440"/>
        <text class="zone-cap" x="24" y="32" id="zc0"></text>
        <text class="zone-cap" x="324" y="32" id="zc1"></text>
        <text class="zone-cap" x="924" y="32" id="zc2"></text>
        <g id="edges"></g>
        <g id="labels"></g>
      </svg>
      <div id="nodes"></div>
      <svg class="overlay" width="1200" height="440" viewBox="0 0 1200 440"><g id="packets"></g></svg>
    </div>
  </div>

  <div class="card" id="card"></div>
  <div class="timeline" id="timeline"></div>
</div>

<script>
// Texte sind [einfach, technisch]; tx() wählt passend zum Modus
let mode = 0, view = 'bug';
const tx = v => Array.isArray(v) ? v[mode] : v;

const TYPES = {
  trigger:  {name:'Auslöser',       c:'var(--trigger)'},
  step:     {name:'Schritt',        c:'var(--step)'},
  store:    {name:'Speicher',       c:'var(--store)'},
  external: {name:'Fremder Dienst', c:'var(--external)'},
};
const ZONES = [['DU','FRONTEND'], ['UNSER SYSTEM','KUBERNETES-CLUSTER'], ['ANDERE FIRMEN','EXTERN']];

// Kopfzeile und Kette: jeder Schritt kann ein Kettenglied (ch) aufleuchten lassen
const HEAD = {
  bug: ['<b>Problem:</b> Die Antwort kommt manchmal doppelt. Warum?',
        '<b>Bug:</b> Duplikate beim Client nach Deployments. Ursachenkette:'],
  fix: ['<b>Lösung:</b> Bei einem Update darf der Bearbeiter seine Aufgabe erst fertig machen.',
        '<b>Fix:</b> Graceful Shutdown – SIGTERM abfangen, laufenden Job abschließen und acken.'],
};
const CHAIN = {
  bug: [['Update kommt','Rolling Update'], ['Bearbeiter wird mitten in der Arbeit gestoppt','Pod wird sofort beendet'],
        ['„Erledigt“ fehlt – Frage kommt nochmal','kein Ack → Redelivery'], ['Antwort doppelt','Duplikat']],
  fix: [['Update kommt','Rolling Update'], ['Bearbeiter macht erst fertig','SIGTERM + Grace Period'],
        ['„Erledigt“ wird gemeldet','Ack vor dem Beenden'], ['Nur eine Antwort','kein Duplikat']],
};

// Aufgabenliste des Bearbeiters
const TASKS = [['Frage holen','Job konsumieren'], ['Claude fragen','LLM-Call'], ['Antwort schicken','Ergebnis pushen'], ['„Erledigt“ melden','Ack senden']];

const NODES = {
  you:    {type:'trigger',  x:150,  y:250, w:230, h:300, label:['Du','Browser'],           sub:['dein Chatfenster','Chat-UI']},
  queue:  {type:'store',    x:420,  y:150, w:180, h:90,  label:['Warteliste','RabbitMQ'],   sub:['merkt sich offene Fragen','chat.requests']},
  worker: {type:'step',     x:720,  y:150, w:220, h:150, label:['Bearbeiter','Worker-Pod'], sub:['arbeitet seine Liste ab','consumer']},
  claude: {type:'external', x:1050, y:150, w:180, h:90,  label:['Claude','Anthropic API'],  sub:['KI','Messages API']},
  kube:   {type:'step',     x:720,  y:365, w:220, h:90,  label:['Kubernetes','Kubernetes'], sub:['tauscht Bearbeiter aus','Deployment-Controller']},
};

const EDGES = {
  yq: {from:'you',    to:'queue',  d:'M 265 150 L 328 150',        verb:['fragt','POST'],              at:[296,138]},
  qw: {from:'queue',  to:'worker', d:'M 512 135 L 608 135',        verb:['gibt weiter','deliver'],     at:[560,123], async:true},
  wq: {from:'worker', to:'queue',  d:'M 608 170 L 512 170',        verb:['„erledigt“','ack'],          at:[560,184]},
  wc: {from:'worker', to:'claude', d:'M 832 135 L 958 135',        verb:['fragt','request'],           at:[895,123]},
  cw: {from:'claude', to:'worker', d:'M 958 165 L 832 165',        verb:['antwortet','response'],      at:[895,179]},
  wy: {from:'worker', to:'you',    d:'M 700 75 V 56 H 190 V 98',   verb:['bringt Antwort','push'],     at:[445,56], async:true},
  kw: {from:'kube',   to:'worker', d:'M 720 318 L 720 227',        verb:['stoppt sofort','SIGKILL'],   at:[720,272]},
};

// Schritte: e = Pfeile, pre/fx = Zustand vor/nach, lbl = Pfeiltext nur für diesen Schritt, ch = Kettenglied, node = nur Kästchen hervorheben
const START = [
  {e:['yq'], t:['Du stellst eine Frage.','Der Request landet als Job in der Queue.'],
   fx:m=>{m.sent=true;m.q='wait'}},
  {e:['qw'], t:['Ein Bearbeiter nimmt die Frage. Die Warteliste merkt sich: Die Frage ist noch nicht erledigt.','Ein Pod bekommt den Job. Bis zum Ack bleibt er in der Queue reserviert.'],
   pre:m=>{m.st='run'}, fx:m=>{m.q='out';m.tasks[0]=1}},
  {e:['wc','cw'], t:['Er fragt Claude und bekommt die Antwort.','LLM-Request und Response.'],
   fx:m=>{m.tasks[1]=1}},
  {e:['wy'], t:['Die Antwort kommt bei dir an. Ein Punkt fehlt noch auf seiner Liste: „erledigt“ melden.','Das Ergebnis wird gepusht. Der Ack steht noch aus.'],
   fx:m=>{m.answers=1;m.tasks[2]=1}},
  {node:'kube', ch:0, t:['Genau jetzt spielt das Team ein Update ein. Kubernetes tauscht alle Bearbeiter gegen die neue Version aus.','Ein Rolling Update startet. Die alten Pods werden ersetzt.'],
   fx:m=>{m.update=true}},
];

const BUG = [
  ...START,
  {e:['kw'], err:true, ch:1, t:['Kubernetes stoppt den Bearbeiter sofort – mitten in seiner Liste. „Erledigt“ melden schafft er nicht mehr.','Der Pod wird ohne Shutdown-Handling beendet. Der Ack wird nie gesendet.'],
   fx:m=>{m.st='dead';m.tasks[3]=2}},
  {e:['qw'], err:true, ch:2, t:['Die Warteliste hat nie „erledigt“ gehört. Also gibt sie die Frage dem neuen Bearbeiter.','Ohne Ack wird der Job redelivered – an den neuen Pod.'],
   pre:m=>{m.st='run';m.ver=2;m.tasks=[0,0,0,0];m.q='wait'}, fx:m=>{m.q='out';m.tasks[0]=1}},
  {e:['wc','cw'], err:true, t:['Der neue Bearbeiter fragt Claude noch einmal.','Zweiter LLM-Call für denselben Job.'],
   fx:m=>{m.tasks[1]=1}},
  {e:['wy'], err:true, ch:3, t:['Du bekommst die Antwort ein zweites Mal.','Der Client erhält ein Duplikat.'],
   fx:m=>{m.answers=2;m.tasks[2]=1}},
];

const FIX = [
  ...START,
  {e:['kw'], ch:1, tag:['mod','geändert'], newE:['kw'], lbl:{kw:['bitte aufhören','SIGTERM']},
   t:['Kubernetes bittet den Bearbeiter aufzuhören – und lässt ihm Zeit, seine Liste fertig zu machen.','SIGTERM statt sofortigem Kill. Der Pod hat eine Grace Period, um den Job abzuschließen.'],
   fx:m=>{m.st='stopping'}},
  {e:['wq'], ch:2, tag:['mod','geändert'], newE:['wq'],
   t:['Er meldet der Warteliste: „erledigt“. Die Frage ist damit abgehakt.','Der Worker sendet den Ack. Der Job ist aus der Queue entfernt.'],
   fx:m=>{m.tasks[3]=3;m.q='done'}},
  {node:'worker', t:['Erst jetzt hört er auf. Der neue Bearbeiter übernimmt ab der nächsten Frage.','Der Pod beendet sich sauber, der neue Pod übernimmt neue Jobs.'],
   fx:m=>{m.st='off'}},
  {node:'you', ch:3, good:true, t:['Ergebnis: Du hast genau eine Antwort.','Ergebnis: kein Duplikat, nur ein LLM-Call.']},
];

// Zustand
const init = () => ({sent:false, q:null, st:'idle', ver:1, tasks:[0,0,0,0], update:false, answers:0});
let model = init(), steps = BUG, pos = 0, activeIdx = -1, playing = false, run = 0;

const $ = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const nodeEls = {}, edgeEls = {}, labelEls = {};

for (const [id, n] of Object.entries(NODES)) {
  const t = TYPES[n.type], d = document.createElement('div');
  d.className = 'node ' + id;
  d.style.cssText = `--c:${t.c};left:${n.x - n.w/2}px;top:${n.y - n.h/2}px;width:${n.w}px;height:${n.h}px`;
  d.innerHTML = `<div class="type">${t.name}</div><div class="label"></div><div class="sub"></div><div class="dyn"></div>`
    + (id === 'worker' ? '<span class="badge"></span>' : '');
  $('nodes').appendChild(d); nodeEls[id] = d;
}
for (const [id, e] of Object.entries(EDGES)) {
  const p = document.createElementNS(SVGNS, 'path');
  p.setAttribute('d', e.d); p.setAttribute('class', 'edge' + (e.async ? ' async' : ''));
  $('edges').appendChild(p); edgeEls[id] = p;
  const g = document.createElementNS(SVGNS, 'g'); g.setAttribute('class', 'elab');
  $('labels').appendChild(g); labelEls[id] = g;
}

function renderTexts(){
  for (const [id, n] of Object.entries(NODES)) {
    nodeEls[id].querySelector('.label').textContent = tx(n.label);
    nodeEls[id].querySelector('.sub').textContent = tx(n.sub);
  }
  ZONES.forEach((z, i) => $('zc' + i).textContent = tx(z));
  $('banner').className = 'banner ' + view;
  $('head').innerHTML = tx(HEAD[view]);
  $('chain').innerHTML = CHAIN[view].map((c, i) => (i ? '<span class="arr">→</span>' : '') + `<span class="c" data-i="${i}">${tx(c)}</span>`).join('');
  $('timeline').innerHTML = '';
}

function dyn(id){
  const m = model;
  switch (id) {
    case 'you': {
      let h = '';
      if (m.sent) h += '<div class="bub me">Was ist RabbitMQ?</div>';
      if (m.answers >= 1) h += '<div class="bub ai">RabbitMQ ist ein Message-Broker …</div>';
      if (m.answers >= 2) h += `<div class="bub ai dup">RabbitMQ ist ein Message-Broker …<small>${tx(['doppelt!','Duplikat'])}</small></div>`;
      return h;
    }
    case 'queue':
      if (m.q === 'wait') return `<span class="slot"></span>${tx(['1 Frage wartet','1 ready'])}`;
      if (m.q === 'out')  return `<span class="slot out"></span>${tx(['wartet auf „erledigt“','1 unacked'])}`;
      if (m.q === 'done') return `<span class="okc">${tx(['abgehakt','acked'])}</span>`;
      return 'leer';
    case 'worker': {
      if (m.st === 'idle') return tx(['wartet','idle']);
      const cls = ['', 'ok', 'fail', 'okg'], mark = ['', '✓', '✕', '✓'];
      return '<div class="tasks">' + TASKS.map((t, i) => {
        const s = m.tasks[i], extra = s === 2 ? ' – fehlt' : '';
        return `<div class="task ${cls[s]}"><i>${mark[s]}</i>${tx(t)}${extra}</div>`;
      }).join('') + '</div>';
    }
    case 'kube': return m.update ? `<span class="hl">${tx(['Update auf Version 2 läuft','Rollout v2'])}</span>` : tx(['nichts zu tun','stabil']);
  }
  return '';
}

const lastHTML = {};
function render(){
  const cur = steps[activeIdx];
  const actE = new Set(cur && cur.e ? cur.e : []);
  const actN = new Set(); actE.forEach(e => { actN.add(EDGES[e].from); actN.add(EDGES[e].to); });
  if (cur && cur.node) actN.add(cur.node);

  for (const id in nodeEls) {
    const n = nodeEls[id];
    n.classList.toggle('active', actN.has(id));
    n.classList.toggle('dead', id === 'worker' && model.st === 'dead');
    n.classList.toggle('off', id === 'worker' && model.st === 'off');
    n.classList.toggle('good', id === 'you' && !!(cur && cur.good));
    const h = dyn(id);
    if (lastHTML[id] !== h) { n.querySelector('.dyn').innerHTML = h; lastHTML[id] = h; }
  }
  const st = model.st, badge = nodeEls.worker.querySelector('.badge');
  badge.textContent = st === 'dead' ? tx(['gestoppt','killed']) : st === 'off' ? tx(['beendet','terminated']) : st === 'stopping' ? tx(['macht fertig …','terminating']) : `${tx(['Version','v'])} ${model.ver}`.replace('v ', 'v');
  badge.hidden = st === 'idle';

  const done = new Set(), errDone = new Set(), newDone = new Set();
  steps.slice(0, pos).forEach(s => (s.e || []).forEach(e => { done.add(e); if (s.err) errDone.add(e); if (s.newE && s.newE.includes(e)) newDone.add(e); }));
  for (const id in edgeEls) {
    const e = EDGES[id], p = edgeEls[id], l = labelEls[id];
    const isA = actE.has(id), isD = done.has(id) && !isA;
    const err = isA ? !!cur.err : errDone.has(id);
    const nw = isA ? !!(cur.newE && cur.newE.includes(id)) : newDone.has(id);
    for (const [k, v] of [['active', isA], ['done', isD], ['err', err], ['new', nw]]) { p.classList.toggle(k, v); l.classList.toggle(k, v); }
    const mk = nw ? (isA ? 'm-new' : 'm-newdim') : err ? (isA ? 'm-err' : 'm-errdim') : isA ? 'm-active' : isD ? 'm-done' : 'm-idle';
    p.setAttribute('marker-end', `url(#${mk})`);
    // Pfeiltext: schrittspezifisch, solange er gilt; in der Lösung bleibt der geänderte Text stehen
    const override = steps.slice(0, Math.max(pos, activeIdx + 1)).reduce((v, s) => (s.lbl && s.lbl[id]) || v, null);
    const verb = tx(override || e.verb), w = verb.length * 6.2 + 10, [cx, cy] = e.at;
    l.innerHTML = `<rect x="${cx - w/2}" y="${cy - 8}" width="${w}" height="16" rx="3"/><text x="${cx}" y="${cy + 4}" text-anchor="middle">${verb}</text>`;
  }

  // Kette im Kopf: erreichte Glieder markieren, aktuelles hervorheben
  const reached = new Set(steps.slice(0, Math.max(pos, activeIdx + 1)).map(s => s.ch).filter(v => v != null));
  document.querySelectorAll('#chain .c').forEach(c => {
    const i = +c.dataset.i;
    c.classList.toggle('on', reached.has(i)); c.classList.toggle('cur', !!cur && cur.ch === i);
  });

  const card = $('card');
  if (!cur) { card.className = 'card'; card.innerHTML = `<div class="no">${steps.length} Schritte</div><div class="big">${tx(['Auf „Abspielen“ klicken.','Abspielen starten.'])}</div>`; }
  else {
    const tag = cur.tag ? `<span class="pill ${cur.tag[0]}">${cur.tag[1]}</span>` : '';
    card.className = 'card' + (cur.err ? ' err' : '');
    card.innerHTML = `<div class="no">Schritt ${activeIdx + 1} von ${steps.length} ${tag}</div><div class="big">${tx(cur.t)}</div>`;
  }

  const tl = $('timeline');
  if (tl.childElementCount !== steps.length * 2 - 1) {
    tl.innerHTML = '';
    steps.forEach((s, i) => {
      if (i) { const ln = document.createElement('span'); ln.className = 'tl-line'; tl.appendChild(ln); }
      const b = document.createElement('button'); b.className = 'tl' + (s.err ? ' err' : '');
      b.textContent = i + 1; b.onclick = () => jump(i + 1); tl.appendChild(b);
    });
  }
  [...tl.querySelectorAll('.tl')].forEach((b, i) => { b.classList.toggle('done', i < pos); b.classList.toggle('cur', i === activeIdx); });
  $('play').textContent = playing ? 'Pause' : (pos >= steps.length ? 'Nochmal' : 'Abspielen');
}

// Animation
const wait = (ms, id) => new Promise(r => setTimeout(() => r(id === run), ms));
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;

function animatePacket(path, color, id){
  return new Promise(resolve => {
    const len = path.getTotalLength(), dur = 700 + len * 2.4;
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('r', 5); c.setAttribute('fill', color);
    $('packets').appendChild(c);
    const t0 = performance.now();
    (function tick(now){
      if (id !== run) { c.remove(); return resolve(false); }
      const k = Math.min(1, (now - t0) / dur), pt = path.getPointAtLength(ease(k) * len);
      c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y);
      if (k < 1) requestAnimationFrame(tick); else { c.remove(); resolve(true); }
    })(t0);
  });
}

async function runStep(i, id){
  const s = steps[i];
  activeIdx = i; if (s.pre) s.pre(model); render();
  if (!await wait(350, id)) return false;
  for (const e of s.e || []) {
    const color = s.err ? '#dc2626' : (s.newE && s.newE.includes(e)) ? '#059669' : '#18181b';
    if (!await animatePacket(edgeEls[e], color, id)) return false;
  }
  if (!s.e && !await wait(500, id)) return false;
  if (s.fx) s.fx(model);
  render();
  return true;
}

function jump(n){
  run++; playing = false; $('packets').innerHTML = '';
  n = Math.max(0, Math.min(steps.length, n));
  model = init();
  for (let j = 0; j < n; j++) { if (steps[j].pre) steps[j].pre(model); if (steps[j].fx) steps[j].fx(model); }
  pos = n; activeIdx = n - 1; render();
}

async function play(){
  if (pos >= steps.length) jump(0);
  const id = ++run; playing = true; render();
  while (pos < steps.length) {
    if (!await runStep(pos, id)) return;
    pos++; render();
    if (pos < steps.length && !await wait(1600, id)) return;
  }
  playing = false; render();
}
function pause(){ jump(pos); }
async function next(){
  if (pos >= steps.length) return;
  jump(pos); const id = run;
  if (await runStep(pos, id)) { pos++; render(); }
}

// Bedienung
const segPick = (seg, b) => [...seg.children].forEach(x => x.classList.toggle('on', x === b));
$('play').onclick = () => playing ? pause() : play();
$('next').onclick = next;
$('prev').onclick = () => jump(pos - 1);
$('mode').onclick = e => { const b = e.target.closest('button'); if (!b) return; mode = +b.dataset.m; segPick($('mode'), b); renderTexts(); render(); };
$('view').onclick = e => {
  const b = e.target.closest('button'); if (!b || b.dataset.v === view) return;
  view = b.dataset.v; segPick($('view'), b);
  steps = view === 'bug' ? BUG : FIX; renderTexts(); jump(0); setTimeout(play, 400);
};
document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') jump(pos - 1);
});

function fit(){
  const s = Math.min(1, $('outer').clientWidth / 1200);
  $('stage').style.transform = `scale(${s})`; $('outer').style.height = 440 * s + 'px';
}
new ResizeObserver(fit).observe($('outer')); fit();
renderTexts(); jump(0);
setTimeout(play, 700);
</script>
</body>
