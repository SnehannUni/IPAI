<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ablauf: Chat mit Claude über RabbitMQ</title>
<style>
:root{
  --bg:#ffffff; --soft:#fafafa; --line:#e4e4e7; --line2:#d4d4d8; --text:#18181b; --muted:#71717a; --faint:#a1a1aa;
  --trigger:#d97706; --step:#2563eb; --store:#059669; --external:#7c3aed; --result:#db2777; --error:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:32px 20px 40px}
header h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--muted)}

.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:24px 0 14px}
button{background:#fff;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:var(--soft);border-color:var(--line2)}
button.primary{background:var(--text);border-color:var(--text);color:#fff;min-width:96px}
button.primary:hover{background:#27272a}
.gap{width:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 10px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--soft);color:var(--text);font-weight:500}
.right{margin-left:auto;display:flex;gap:16px;align-items:center}
.toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--text);width:14px;height:14px;margin:0}

.stage-outer{position:relative;width:100%}
.stage{position:absolute;top:0;left:0;width:1200px;height:680px;transform-origin:0 0;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stage svg{position:absolute;inset:0;overflow:visible}

.zone-cap{font-size:11px;font-weight:600;letter-spacing:.08em;fill:var(--text)}
.zone-sub{font-size:12px;fill:var(--muted)}
.zone-div{stroke:var(--line);stroke-width:1}
.zone-note{font-size:11.5px;fill:var(--faint)}

.edge{fill:none;stroke:var(--line2);stroke-width:1.5;transition:stroke .3s}
.edge.async{stroke-dasharray:5 5}
.edge.done{stroke:var(--faint)}
.edge.active{stroke:var(--text)}
.edge.async.active{animation:march .8s linear infinite}
.edge.errpath{stroke:#fecaca}
.edge.errpath.done{stroke:#f87171}
.edge.errpath.active,.edge.active.err{stroke:var(--error)}
@keyframes march{to{stroke-dashoffset:-10}}
.elab rect{fill:#fff}
.elab text{fill:var(--faint);font-size:11px;transition:fill .3s}
.elab.done text{fill:var(--muted)}
.elab.active text{fill:var(--text);font-weight:500}
.elab.err text{fill:var(--error)}
body:not(.errmode) .erronly{display:none}

.pk-label rect{fill:#fff;stroke:var(--line2)}
.pk-label text{fill:var(--text);font-size:11px;font-weight:500}

.stage svg.overlay{pointer-events:none;z-index:3}
.node{position:absolute;display:flex;flex-direction:column;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.3;transition:border-color .3s,box-shadow .3s}
.node>*{flex-shrink:0}
.node.active{border-color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.06)}
.node .type{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.node .type::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.node .label{font-weight:600;font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .sub{color:var(--muted);font-size:11.5px;font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .dyn{margin-top:7px;font-size:12px;color:var(--muted);min-height:16px;white-space:nowrap}
/* Chatfenster: füllt den Rest des Kästchens, neueste Nachricht bleibt sichtbar */
.node.result .dyn{flex:1;min-height:0;white-space:normal;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.node .badge{position:absolute;top:9px;right:10px;font-size:11px;color:var(--muted);background:#f4f4f5;border-radius:4px;padding:0 6px}

.input{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:6px;padding:3px 3px 3px 8px;font-size:12px;color:var(--text)}
.input .ph{color:var(--faint)}
.input b{background:var(--text);color:#fff;border-radius:4px;font-size:10.5px;font-weight:500;padding:2px 7px}

.slots{display:flex;gap:3px;align-items:center;height:16px}
.slot{width:14px;height:10px;border-radius:2px;background:var(--text);animation:pop .3s ease-out}
.slots em{font-style:normal;margin-left:5px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

.rows{display:flex;gap:3px;align-items:center;height:16px}
.rows i{display:block;width:20px;height:4px;border-radius:1px;background:var(--line2);animation:pop .3s ease-out}
.rows em{font-style:normal;margin-left:5px}

.status{display:inline-flex;align-items:center;gap:6px}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--line2)}
.status.busy .dot,.status.wait .dot{background:var(--text);animation:blink 1s infinite}
.status.busy,.status.wait{color:var(--text)}
.status.error{color:var(--error)}.status.error .dot{background:var(--error)}
.status.ok .dot{background:var(--store)}
@keyframes blink{50%{opacity:.25}}

.chat{display:flex;flex-direction:column;gap:6px}
.bub{max-width:92%;padding:5px 9px;border-radius:8px;font-size:12px;line-height:1.4;color:var(--text);animation:pop .25s ease-out}
.bub.me{align-self:flex-end;background:#f4f4f5}
.bub.ai{align-self:flex-start;border:1px solid var(--line)}
.typing{display:inline-flex;gap:3px;align-items:center;height:12px;vertical-align:middle}
.typing i{width:4px;height:4px;border-radius:50%;background:var(--faint);animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.typing + span{color:var(--muted);font-size:11.5px;margin-left:6px}
@keyframes bounce{0%,60%,100%{opacity:.35}30%{opacity:1}}
.caret{display:inline-block;width:1.5px;height:12px;background:var(--text);vertical-align:-2px;margin-left:1px;animation:blink .8s infinite}

.below{display:grid;gap:16px;margin-top:16px}
.card{border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-height:124px}
.card .no{font-size:12px;color:var(--muted)}
.card h2{margin:2px 0 4px;font-size:15px;font-weight:600}
.card p{margin:0 0 12px;color:#3f3f46;max-width:860px}
.route{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:2px 9px;border-radius:6px;border:1px solid var(--line)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.verb{color:var(--muted)}
.kind{margin-left:4px;color:var(--faint)}
.kind.err{color:var(--error)}

.timeline{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tl{width:26px;height:26px;border-radius:50%;padding:0;font-size:11.5px;color:var(--faint);display:grid;place-items:center}
.tl.done{color:var(--text)}
.tl.cur{background:var(--text);border-color:var(--text);color:#fff}
.tl.err{border-color:#fecaca}
.tl.err.cur{background:var(--error);border-color:var(--error)}
.tl-line{flex:0 0 8px;height:1px;background:var(--line)}

.legend{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;color:var(--muted);font-size:12.5px;padding-top:4px}
.legend .it{display:flex;gap:7px;align-items:center}
.legend .sw{width:6px;height:6px;border-radius:50%;background:var(--c)}
.legend .sep{width:1px;height:14px;background:var(--line)}
.legend svg{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Chat mit Claude über eine RabbitMQ-Warteschlange</h1>
    <p>Was passiert zwischen „Senden“ und der Antwort.</p>
  </header>

  <div class="controls">
    <button class="primary" id="play">Abspielen</button>
    <button id="prev" title="Schritt zurück (←)">Zurück</button>
    <button id="next" title="Schritt weiter (→)">Weiter</button>
    <button id="restart">Neustart</button>
    <span class="gap"></span>
    <div class="seg" id="speed">
      <button data-s="0.5">0,5×</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button>
    </div>
    <div class="right">
      <label class="toggle"><input type="checkbox" id="err"> Fehlerfall zeigen</label>
      <div class="seg" id="mode">
        <button data-m="0" class="on">Einfach</button><button data-m="1">Technisch</button>
      </div>
    </div>
  </div>

  <div class="stage-outer" id="outer">
    <div class="stage" id="stage">
      <svg id="svg" width="1200" height="680" viewBox="0 0 1200 680">
        <defs>
          <marker id="m-idle"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#d4d4d8"/></marker>
          <marker id="m-done"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a1a1aa"/></marker>
          <marker id="m-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#18181b"/></marker>
          <marker id="m-err"    viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#dc2626"/></marker>
          <marker id="m-errdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#fecaca"/></marker>
        </defs>
        <g id="zones">
          <rect x="0" y="0" width="300" height="680" fill="#fafafa"/>
          <rect x="900" y="0" width="300" height="680" fill="#fafafa"/>
          <line class="zone-div" x1="300" y1="0" x2="300" y2="680"/>
          <line class="zone-div" x1="900" y1="0" x2="900" y2="680"/>
          <text class="zone-cap" x="24" y="38" id="zc0"></text><text class="zone-sub" x="24" y="56" id="zs0"></text>
          <text class="zone-cap" x="324" y="38" id="zc1"></text><text class="zone-sub" x="324" y="56" id="zs1"></text>
          <text class="zone-cap" x="924" y="38" id="zc2"></text><text class="zone-sub" x="924" y="56" id="zs2"></text>
          <text class="zone-note" x="924" y="652" id="znote"></text>
        </g>
        <g id="edges"></g>
        <g id="labels"></g>
      </svg>
      <div id="nodes"></div>
      <!-- Pakete liegen über den Kästchen, damit nichts darunter verschwindet -->
      <svg class="overlay" width="1200" height="680" viewBox="0 0 1200 680"><g id="packets"></g></svg>
    </div>
  </div>

  <div class="below">
    <div class="card" id="card"></div>
    <div class="timeline" id="timeline"></div>
    <div class="legend">
      <div class="it"><span class="sw" style="--c:var(--trigger)"></span>Auslöser</div>
      <div class="it"><span class="sw" style="--c:var(--step)"></span>Schritt</div>
      <div class="it"><span class="sw" style="--c:var(--store)"></span>Speicher</div>
      <div class="it"><span class="sw" style="--c:var(--external)"></span>Fremder Dienst</div>
      <div class="it"><span class="sw" style="--c:var(--result)"></span>Ergebnis</div>
      <span class="sep"></span>
      <div class="it"><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" stroke="#71717a" stroke-width="1.5"/></svg><span id="lg0"></span></div>
      <div class="it"><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" stroke="#71717a" stroke-width="1.5" stroke-dasharray="5 5"/></svg><span id="lg1"></span></div>
      <div class="it"><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 5"/></svg><span id="lg2"></span></div>
    </div>
  </div>
</div>

<script>
const ANSWER = 'RabbitMQ ist ein Message-Broker. Er nimmt Nachrichten an und verteilt sie über Warteschlangen an Programme.';

// Texte sind [einfach, technisch]; tx() wählt passend zum Modus
let mode = 0;
const tx = v => Array.isArray(v) ? v[mode] : v;

const UI = {
  zones: [['DU','FRONTEND'], ['UNSER SYSTEM','BACKEND'], ['ANDERE FIRMEN','EXTERN']],
  zoneSubs: [['dein Bildschirm','Client / Browser'], ['arbeitet im Hintergrund','eigene Services'], ['fremde Dienste','Third-Party-APIs']],
  zoneNote: ['Nicht unter unserer Kontrolle.','Latenz und Ausfälle nicht kontrollierbar.'],
  sync: ['wartet auf Antwort','synchron'],
  async: ['läuft nebenher','asynchron'],
  err: ['Fehlerweg','Fehlerpfad'],
};

const TYPES = {
  trigger:  {name:'Auslöser',       c:'var(--trigger)'},
  step:     {name:'Schritt',        c:'var(--step)'},
  store:    {name:'Speicher',       c:'var(--store)'},
  external: {name:'Fremder Dienst', c:'var(--external)'},
  result:   {name:'Ergebnis',       c:'var(--result)'},
};

const NODES = {
  btn:    {type:'trigger',  x:150,  y:150, w:220, h:112,  label:['Frage stellen','Chat-Input'],             sub:['Eingabefeld im Chat','UI-Event: submit']},
  api:    {type:'step',     x:440,  y:150, w:200, h:96,  label:['Empfang','REST-API'],                     sub:['nimmt Fragen an','POST /messages']},
  qreq:   {type:'store',    x:740,  y:150, w:200, h:96,  label:['Warteliste: Fragen','RabbitMQ Queue'],    sub:['Fragen warten hier','chat.requests']},
  db:     {type:'store',    x:440,  y:350, w:200, h:96,  label:['Archiv','PostgreSQL'],                    sub:['merkt sich den Chat','Tabelle messages']},
  worker: {type:'step',     x:740,  y:350, w:200, h:96,  label:['Bearbeiter','Worker'],                    sub:['kümmert sich um Fragen','Consumer · LLM-Client']},
  anth:   {type:'external', x:1050, y:350, w:200, h:96,  label:['Claude','Anthropic API'],                 sub:['KI von Anthropic','Messages API']},
  qres:   {type:'store',    x:740,  y:550, w:200, h:96,  label:['Warteliste: Antworten','RabbitMQ Queue'], sub:['Antworten warten hier','chat.responses']},
  gw:     {type:'step',     x:440,  y:550, w:200, h:96,  label:['Zusteller','WebSocket-Gateway'],         sub:['offene Leitung zu dir','Server-Push']},
  result: {type:'result',   x:150,  y:555, w:240, h:210, label:['Antwort im Chat','Chat-UI'],              sub:['dein Chatfenster','Message-Liste']},
};

const EDGES = {
  e1:  {from:'btn',   to:'api',   d:'M 260 136 L 338 136', verb:['gibt ab','POST'],          lab:[0,-12]},
  ack: {from:'api',   to:'btn',   d:'M 340 166 L 262 166', verb:['bestätigt','202'],         lab:[0,12]},
  e2:  {from:'api',   to:'db',    d:'M 440 198 L 440 300', verb:['notiert','INSERT'],        lab:[34,0]},
  e3:  {from:'api',   to:'qreq',  d:'M 540 150 L 638 150', verb:['legt ab','publish'],       lab:[0,-12], async:true},
  e4:  {from:'qreq',  to:'worker',d:'M 740 198 L 740 300', verb:['nimmt','consume'],         lab:[34,0],  async:true},
  e5:  {from:'worker',to:'anth',  d:'M 840 334 L 948 334', verb:['fragt','request'],         lab:[0,-12]},
  e6:  {from:'anth',  to:'worker',d:'M 950 366 L 842 366', verb:['antwortet','response'],    lab:[0,12]},
  e6x: {from:'anth',  to:'worker',d:'M 1010 398 C 1010 470, 800 470, 800 404', verb:['überlastet','529'], lab:[0,0], err:true},
  er:  {from:'worker',to:'qreq',  d:'M 842 316 C 896 284, 896 182, 844 162', verb:['legt zurück','requeue'], lab:[26,0], async:true, err:true},
  e7:  {from:'worker',to:'db',    d:'M 640 350 L 542 350', verb:['notiert','INSERT'],        lab:[0,-12]},
  e8:  {from:'worker',to:'qres',  d:'M 740 398 L 740 500', verb:['legt ab','publish'],       lab:[34,0],  async:true},
  e9:  {from:'qres',  to:'gw',    d:'M 640 550 L 542 550', verb:['nimmt','consume'],         lab:[0,-12], async:true},
  e10: {from:'gw',    to:'result',d:'M 340 550 L 272 550', verb:['bringt','push'],           lab:[0,-12], async:true},
};

function buildSteps(err){
  const s = [
    {e:'e1', pk:['„Was ist RabbitMQ?“','POST /messages'],
     t:['Frage abschicken','HTTP-Request'],
     x:['Du tippst deine Frage ein und drückst auf Senden. Die Frage geht an den Empfang.',
        'Das submit-Event löst einen HTTP-Request aus: POST /messages mit dem Nachrichtentext an die REST-API.'],
     fx:m=>{m.sent=true}},
    {e:'e2', pk:['Frage','INSERT message'],
     t:['Frage notieren','Nachricht persistieren'],
     x:['Der Empfang schreibt die Frage ins Archiv. So geht der Chat nicht verloren.',
        'Die API speichert die Nachricht per INSERT in PostgreSQL (Tabelle messages), bevor sie weiterverarbeitet wird.'],
     fx:m=>{m.db++}},
    {e:'e3', pk:['Auftrag','job #42'],
     t:['Auf die Warteliste','Job publizieren'],
     x:['Der Empfang wartet nicht selbst auf Claude. Er legt die Frage auf eine Warteliste und ist sofort wieder frei.',
        'Die API publiziert einen Job in die RabbitMQ-Queue chat.requests und blockiert nicht auf den LLM-Call.'],
     fx:m=>{m.q1++}},
    {e:'ack', pk:['angekommen','202 Accepted'],
     t:['Kurze Rückmeldung','202 Accepted'],
     x:['Du bekommst sofort Bescheid, dass deine Frage angekommen ist. Im Chat steht jetzt „Claude schreibt …“.',
        'Die API antwortet sofort mit 202 Accepted. Das Frontend zeigt einen Typing-Indikator an.'],
     fx:m=>{m.res='typing'}},
    {e:'e4', pk:['Auftrag','job #42'],
     t:['Bearbeiter nimmt die Frage','Job konsumieren'],
     x:['Ein Bearbeiter nimmt sich die nächste Frage von der Warteliste.',
        'Ein Worker-Prozess konsumiert den Job aus chat.requests (prefetch 1, manuelles Ack).'],
     fx:m=>{m.q1--;m.worker='busy'}},
    {e:'e5', pk:['Frage + bisheriger Chat','POST /v1/messages'],
     t:['Claude fragen','LLM-Request'],
     x:['Der Bearbeiter gibt die Frage zusammen mit dem bisherigen Chat an Claude weiter und wartet.',
        'Der Worker ruft die Anthropic Messages API auf (POST /v1/messages) mit dem Verlauf als messages-Array.'],
     fx:m=>{m.worker='wait'}},
  ];
  if (err) s.push(
    {e:'e6x', err:true, pk:['überlastet','529 Overloaded'],
     t:['Claude ist überlastet','529 Overloaded'],
     x:['Claude hat gerade zu viel zu tun und sagt ab. Die Frage geht aber nicht verloren.',
        'Die Anthropic API antwortet mit HTTP 529 (overloaded_error). Der Job wird nicht verworfen.'],
     fx:m=>{m.worker='error'}},
    {e:'er', err:true, pk:['Auftrag, 2. Versuch','job #42 retry=2'],
     t:['Zurück auf die Warteliste','Requeue mit Backoff'],
     x:['Der Bearbeiter legt die Frage zurück auf die Warteliste und versucht es nach einer kurzen Pause nochmal.',
        'Der Worker sendet ein Nack mit Requeue über eine Delay-Queue mit Backoff. Retry-Zähler: 2.'],
     fx:m=>{m.q1++;m.worker='idle';m.attempt=2}},
    {e:'e4', pk:['Auftrag, 2. Versuch','job #42 retry=2'],
     t:['Neuer Versuch','Erneut konsumieren'],
     x:['Nach der Pause nimmt der Bearbeiter die Frage wieder.',
        'Nach Ablauf des Backoffs wird der Job erneut zugestellt und konsumiert.'],
     fx:m=>{m.q1--;m.worker='busy'}},
    {e:'e5', pk:['Frage + bisheriger Chat','POST /v1/messages'],
     t:['Claude nochmal fragen','LLM-Request (Retry)'],
     x:['Zweiter Versuch: Die Frage geht wieder an Claude.',
        'Zweiter Aufruf von POST /v1/messages mit identischem Payload.'],
     fx:m=>{m.worker='wait'}},
  );
  s.push(
    {e:'e6', pk:['Antwort','200 OK'],
     t:['Claude antwortet','LLM-Response'],
     x:['Claude schickt die fertige Antwort an den Bearbeiter zurück.',
        'Die API liefert 200 OK mit dem Antworttext (content-Block) und der Token-Usage zurück.'],
     fx:m=>{m.worker='busy'}},
    {e:'e7', pk:['Antwort','INSERT message'],
     t:['Antwort notieren','Antwort persistieren'],
     x:['Die Antwort kommt auch ins Archiv. Jetzt ist der ganze Chat gespeichert.',
        'Der Worker speichert die Assistant-Nachricht in PostgreSQL.'],
     fx:m=>{m.db++}},
    {e:'e8', pk:['Antwort','result #42'],
     t:['Auf die Antwort-Warteliste','Ergebnis publizieren'],
     x:['Der Bearbeiter legt die Antwort auf eine zweite Warteliste und kümmert sich um die nächste Frage.',
        'Der Worker publiziert das Ergebnis in chat.responses und bestätigt den ursprünglichen Job (Ack).'],
     fx:m=>{m.q2++;m.worker='idle'}},
    {e:'e9', pk:['Antwort','result #42'],
     t:['Zusteller nimmt die Antwort','Ergebnis konsumieren'],
     x:['Der Zusteller nimmt die Antwort und weiß, zu wem sie gehört.',
        'Das WebSocket-Gateway konsumiert chat.responses und ordnet das Ergebnis per Conversation-ID der offenen Client-Verbindung zu.'],
     fx:m=>{m.q2--}},
    {e:'e10', pk:['Antwort','ws: message'],
     t:['Antwort zu dir bringen','Server-Push'],
     x:['Über eine offene Leitung bringt der Zusteller die Antwort direkt auf deinen Bildschirm. Du musst nicht nachfragen.',
        'Das Gateway pusht die Nachricht über die bestehende WebSocket-Verbindung an den Client, ganz ohne Polling.'],
     fx:m=>{m.res='stream';m.chars=0}},
    {node:'result', stream:true,
     t:['Antwort erscheint','Rendern'],
     x:['Die Antwort erscheint in deinem Chat.',
        'Das Frontend aktualisiert den State und rendert die Assistant-Nachricht.'],
     fx:m=>{m.res='done';m.chars=ANSWER.length}},
  );
  return s;
}

// Zustand
const init = () => ({sent:false, db:0, q1:0, q2:0, worker:'idle', res:'none', chars:0, attempt:1});
let model = init(), steps = buildSteps(false), pos = 0, activeIdx = -1, playing = false, run = 0, speed = 1;

// Aufbau
const $ = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const nodeEls = {}, edgeEls = {}, labelEls = {};

for (const [id, n] of Object.entries(NODES)) {
  const t = TYPES[n.type], el = document.createElement('div');
  el.className = 'node ' + n.type; el.style.cssText = `--c:${t.c};left:${n.x-n.w/2}px;top:${n.y-n.h/2}px;width:${n.w}px;height:${n.h}px`;
  el.innerHTML = `<div class="type">${t.name}</div><div class="label"></div><div class="sub"></div><div class="dyn"></div><span class="badge" hidden></span>`;
  $('nodes').appendChild(el); nodeEls[id] = el;
}
for (const [id, e] of Object.entries(EDGES)) {
  const p = document.createElementNS(SVGNS, 'path');
  p.setAttribute('d', e.d);
  p.setAttribute('class', 'edge' + (e.async ? ' async' : '') + (e.err ? ' errpath erronly' : ''));
  $('edges').appendChild(p); edgeEls[id] = p;
  const g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('class', 'elab' + (e.err ? ' err erronly' : ''));
  $('labels').appendChild(g); labelEls[id] = g;
}

// Alle Texte, die vom Modus abhängen
function renderTexts(){
  for (const [id, n] of Object.entries(NODES)) {
    nodeEls[id].querySelector('.label').textContent = tx(n.label);
    nodeEls[id].querySelector('.sub').textContent = tx(n.sub);
  }
  for (const [id, e] of Object.entries(EDGES)) {
    const p = edgeEls[id], mid = p.getPointAtLength(p.getTotalLength()/2), verb = tx(e.verb);
    const w = verb.length * 6 + 10, cx = mid.x + e.lab[0], cy = mid.y + e.lab[1];
    labelEls[id].innerHTML = `<rect x="${cx-w/2}" y="${cy-8}" width="${w}" height="16" rx="3"/><text x="${cx}" y="${cy+4}" text-anchor="middle">${verb}</text>`;
  }
  UI.zones.forEach((z,i) => { $('zc'+i).textContent = tx(z); $('zs'+i).textContent = tx(UI.zoneSubs[i]); });
  $('znote').textContent = tx(UI.zoneNote);
  $('lg0').textContent = tx(UI.sync); $('lg1').textContent = tx(UI.async); $('lg2').textContent = tx(UI.err);
  $('timeline').innerHTML = '';
}

// Darstellung
function dyn(id){
  const m = model;
  switch(id){
    case 'btn': return `<div class="input">${m.sent ? '<span class="ph">Nachricht …</span>' : '<span>Was ist RabbitMQ?</span>'}<b>Senden</b></div>`;
    case 'db': return `<div class="rows">${'<i></i>'.repeat(m.db)}<em>${m.db} ${tx(m.db===1 ? ['Eintrag','Row'] : ['Einträge','Rows'])}</em></div>`;
    case 'qreq': case 'qres': {
      const n = id==='qreq' ? m.q1 : m.q2;
      return `<div class="slots">${'<span class="slot"></span>'.repeat(n)}<em>${n ? n+' '+tx(['wartend', n===1?'Message':'Messages']) : 'leer'}</em></div>`;
    }
    case 'worker': {
      const map = {idle:['',['bereit','idle']], busy:['busy',['arbeitet','busy']], wait:['wait',['wartet auf Claude','wartet auf Response']], error:['error',['Fehler','Fehler 529']]};
      const [c, txt] = map[m.worker];
      return `<span class="status ${c}"><span class="dot"></span>${tx(txt)}</span>`;
    }
    case 'gw': return `<span class="status ok"><span class="dot"></span>${tx(['mit dir verbunden','1 Client verbunden'])}</span>`;
    case 'anth': return m.worker==='wait' ? `<span class="status busy"><span class="dot"></span>${tx(['denkt nach','verarbeitet'])}</span>` : '';
    case 'result': {
      let h = '<div class="chat">';
      if (m.sent) h += '<div class="bub me">Was ist RabbitMQ?</div>';
      if (m.res==='typing' || (m.res==='stream' && m.chars===0))
        h += '<div class="bub ai"><span class="typing"><i></i><i></i><i></i></span><span>Claude schreibt …</span></div>';
      else if (m.res==='stream') h += `<div class="bub ai">${ANSWER.slice(0,m.chars)}<span class="caret"></span></div>`;
      else if (m.res==='done') h += `<div class="bub ai">${ANSWER}</div>`;
      return h + '</div>';
    }
  }
  return '';
}

const lastHTML = {};
function renderNodes(){
  const s = steps[activeIdx];
  const act = s ? (s.node ? [s.node] : [EDGES[s.e].from, EDGES[s.e].to]) : [];
  for (const id in nodeEls) {
    nodeEls[id].classList.toggle('active', act.includes(id));
    const h = dyn(id);
    if (lastHTML[id] !== h) { nodeEls[id].querySelector('.dyn').innerHTML = h; lastHTML[id] = h; }
  }
  const badge = nodeEls.worker.querySelector('.badge');
  badge.hidden = model.attempt < 2;
  badge.textContent = tx(['Versuch ','retry=']) + model.attempt;
}

function render(){
  renderNodes();
  const done = new Set(steps.slice(0, pos).map(s => s.e).filter(Boolean));
  const cur = steps[activeIdx], curE = cur && cur.e;
  for (const id in edgeEls) {
    const e = EDGES[id], p = edgeEls[id], l = labelEls[id];
    const isA = id === curE, isD = done.has(id);
    p.classList.toggle('active', isA); p.classList.toggle('done', isD && !isA);
    p.classList.toggle('err', isA && !!cur.err);
    l.classList.toggle('active', isA && !e.err); l.classList.toggle('done', isD && !isA);
    const mk = e.err ? (isA ? 'm-err' : 'm-errdim') : isA ? 'm-active' : isD ? 'm-done' : 'm-idle';
    p.setAttribute('marker-end', `url(#${mk})`);
  }
  renderCard(); renderTimeline();
  $('play').textContent = playing ? 'Pause' : (pos >= steps.length ? 'Nochmal' : 'Abspielen');
}

function chip(id){ const n = NODES[id]; return `<span class="chip" style="--c:${TYPES[n.type].c}">${tx(n.label)}</span>`; }
function renderCard(){
  const s = steps[activeIdx];
  if (!s) {
    $('card').innerHTML = `<div class="no">${steps.length} Schritte</div><h2>Bereit</h2><p>Abspielen starten oder mit den Pfeiltasten Schritt für Schritt durchgehen. Leertaste startet und pausiert.</p>`;
    return;
  }
  let route;
  if (s.node) route = chip(s.node);
  else {
    const e = EDGES[s.e];
    const kind = s.err ? `<span class="kind err">${tx(UI.err)}</span>` : `<span class="kind">${tx(e.async ? UI.async : UI.sync)}</span>`;
    route = `${chip(e.from)}<span class="verb">${tx(e.verb)} →</span>${chip(e.to)}${kind}`;
  }
  $('card').innerHTML = `<div class="no">Schritt ${activeIdx+1} von ${steps.length}</div><h2>${tx(s.t)}</h2><p>${tx(s.x)}</p><div class="route">${route}</div>`;
}

function renderTimeline(){
  const tl = $('timeline');
  if (tl.childElementCount !== steps.length*2-1) {
    tl.innerHTML = '';
    steps.forEach((s,i) => {
      if (i) { const ln = document.createElement('span'); ln.className = 'tl-line'; tl.appendChild(ln); }
      const b = document.createElement('button'); b.className = 'tl' + (s.err ? ' err' : ''); b.textContent = i+1; b.title = tx(s.t);
      b.onclick = () => jump(i+1); tl.appendChild(b);
    });
  }
  [...tl.querySelectorAll('.tl')].forEach((b,i) => { b.classList.toggle('done', i < pos); b.classList.toggle('cur', i === activeIdx); });
}

// Animation
const wait = (ms, id) => new Promise(r => setTimeout(() => r(id === run), ms));
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

function animatePacket(path, label, color, id){
  return new Promise(resolve => {
    const len = path.getTotalLength(), dur = (750 + len*3.2) / speed;
    const g = document.createElementNS(SVGNS, 'g');
    const w = label.length * 6 + 14;
    g.innerHTML = `<circle r="4" fill="${color}"/>
      <g class="pk-label" transform="translate(0,-18)"><rect x="${-w/2}" y="-9" width="${w}" height="18" rx="4"/><text y="4" text-anchor="middle">${label}</text></g>`;
    $('packets').appendChild(g);
    const lab = g.querySelector('.pk-label');
    const t0 = performance.now();
    (function tick(now){
      if (id !== run) { g.remove(); return resolve(false); }
      const k = Math.min(1, (now - t0) / dur), pt = path.getPointAtLength(ease(k) * len);
      g.setAttribute('transform', `translate(${pt.x},${pt.y})`);
      // Label am Bühnenrand nach innen schieben, damit es nie abgeschnitten wird
      const dx = Math.max(8 - (pt.x - w/2), 0) + Math.min(1192 - (pt.x + w/2), 0);
      lab.setAttribute('transform', `translate(${dx},-18)`);
      if (k < 1) requestAnimationFrame(tick);
      else { g.style.transition = 'opacity .2s'; g.style.opacity = 0; setTimeout(() => g.remove(), 220); resolve(true); }
    })(t0);
  });
}

async function typewriter(id){
  model.res = 'stream';
  for (let c = 0; c <= ANSWER.length; c += 2) {
    if (id !== run) return false;
    model.chars = c; renderNodes();
    await new Promise(r => setTimeout(r, 22 / speed));
  }
  return id === run;
}

async function runStep(i, id){
  activeIdx = i; render();
  if (!await wait(220 / speed, id)) return false;
  const s = steps[i];
  if (s.e && !await animatePacket(edgeEls[s.e], tx(s.pk), s.err ? '#dc2626' : '#18181b', id)) return false;
  if (s.stream && !await typewriter(id)) return false;
  s.fx(model); render();
  return true;
}

function jump(n){
  run++; playing = false; $('packets').innerHTML = '';
  n = Math.max(0, Math.min(steps.length, n));
  model = init(); for (let j = 0; j < n; j++) steps[j].fx(model);
  pos = n; activeIdx = n - 1; render();
}

async function play(){
  if (pos >= steps.length) jump(0);
  const id = ++run; playing = true; render();
  while (pos < steps.length) {
    if (!await runStep(pos, id)) return;
    pos++; render();
    if (pos < steps.length && !await wait(480 / speed, id)) return;
  }
  playing = false; render();
}
function pause(){ jump(pos); }

async function next(){
  if (pos >= steps.length) return;
  jump(pos); const id = run;
  if (await runStep(pos, id)) { pos++; render(); }
}

// Bedienung
$('play').onclick = () => playing ? pause() : play();
$('next').onclick = next;
$('prev').onclick = () => jump(pos - 1);
$('restart').onclick = () => { jump(0); play(); };
$('speed').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  speed = +b.dataset.s; [...$('speed').children].forEach(x => x.classList.toggle('on', x === b));
};
$('mode').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  mode = +b.dataset.m; [...$('mode').children].forEach(x => x.classList.toggle('on', x === b));
  renderTexts(); render();
};
$('err').onchange = e => {
  document.body.classList.toggle('errmode', e.target.checked);
  steps = buildSteps(e.target.checked); $('timeline').innerHTML = ''; jump(0); play();
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') jump(pos - 1);
});

function fit(){
  const s = Math.min(1, $('outer').clientWidth / 1200);
  $('stage').style.transform = `scale(${s})`; $('outer').style.height = 680 * s + 'px';
}
new ResizeObserver(fit).observe($('outer')); fit();
renderTexts(); render();
setTimeout(play, 700);
</script>
</body>
</html>
