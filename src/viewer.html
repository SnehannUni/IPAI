<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow</title>
<style>
/* Theme (docs/FORMAT.md, "theme"): a host sets the base colours; the rest is mixed from them, so a dark theme
   gets dark tints without naming each one */
:root{
  --bg:#ffffff; --surface:#ffffff; --text:#18181b; --accent:#18181b; --on-accent:#ffffff;
  --trigger:#d97706; --step:#2563eb; --store:#059669; --external:#7c3aed; --result:#db2777; --screen:var(--muted);
  --error:#dc2626; --ok:#059669; --mod:#2563eb;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --radius:10px;
  --soft:color-mix(in srgb,var(--text) 2.5%,var(--surface)); --chip:color-mix(in srgb,var(--text) 5%,var(--surface));
  --line:color-mix(in srgb,var(--text) 11%,var(--surface)); --line2:color-mix(in srgb,var(--text) 18%,var(--surface));
  --faint:color-mix(in srgb,var(--text) 40%,var(--surface)); --muted:color-mix(in srgb,var(--text) 58%,var(--surface));
  --body:color-mix(in srgb,var(--text) 82%,var(--surface));
  --error-soft:color-mix(in srgb,var(--error) 8%,var(--surface)); --error-line:color-mix(in srgb,var(--error) 42%,var(--surface)); --error-text:color-mix(in srgb,var(--error) 82%,var(--text));
  --ok-soft:color-mix(in srgb,var(--ok) 8%,var(--surface)); --ok-line:color-mix(in srgb,var(--ok) 42%,var(--surface)); --ok-text:color-mix(in srgb,var(--ok) 82%,var(--text));
  --mod-soft:color-mix(in srgb,var(--mod) 8%,var(--surface)); --mod-line:color-mix(in srgb,var(--mod) 42%,var(--surface)); --mod-text:color-mix(in srgb,var(--mod) 82%,var(--text));
  /* The parts, each from the colours above unless a host sets it */
  --stage:var(--surface); --zone:transparent; --zone-edge:var(--soft); --node:var(--surface);
  --card:transparent; --banner:var(--soft);
  --button:var(--surface); --button-text:var(--text); --button-border:var(--line); --button-hover:var(--soft);
  --segment-on:var(--soft); --control-radius:6px;
  --primary:var(--accent); --on-primary:var(--on-accent);
  /* Labels (zone captions, box types, step counter, legend, buttons) can speak in another voice than the text */
  --label-font:var(--font); --label-transform:none; --label-tracking:0em;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:1560px;margin:0 auto;padding:10px 12px 10px}
header{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:13px}
header p:empty{display:none}

.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0 10px}
button{background:var(--button);color:var(--button-text);border:1px solid var(--button-border);border-radius:var(--control-radius);padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:var(--button-hover);border-color:var(--line2)}
button.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);min-width:96px}
button.primary:hover{background:color-mix(in srgb,var(--primary) 88%,var(--surface))}
button,.node .type,.card .no,.legend,.demo-hint{font-family:var(--label-font);text-transform:var(--label-transform);letter-spacing:var(--label-tracking)}
.seg{display:flex;border:1px solid var(--button-border);border-radius:var(--control-radius);overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--button-border)}
.seg button.on{background:var(--segment-on);color:var(--button-text);font-weight:500}
.seg.big{margin-right:10px}
.seg.big button{padding:5px 16px;font-size:13.5px}
.seg.big button.on.bug{color:var(--error)}
.seg.big button.on.fix{color:var(--ok)}
.right{margin-left:auto}
[hidden]{display:none!important}

.banner{border-radius:var(--radius);padding:9px 14px;margin-bottom:10px;background:var(--banner)}
.banner .head{font-size:14px}
.banner .head b{font-weight:600}
.banner.bug{background:var(--error-soft)}.banner.bug .head b{color:var(--error-text)}
.banner.fix{background:var(--ok-soft)}.banner.fix .head b{color:var(--ok-text)}
.chain{display:flex;flex-wrap:nowrap;gap:5px;align-items:center;margin-top:6px;overflow-x:auto;scrollbar-width:none}
.chain::-webkit-scrollbar{display:none}
.chain .c,.chain .arr{flex-shrink:0;white-space:nowrap}
.chain:empty{display:none}
.chain .c{font-size:12px;padding:1px 9px;border-radius:99px;border:1px solid transparent;background:var(--surface);color:var(--faint);transition:all .3s}
.chain .arr{color:var(--faint);font-size:12px}
.chain .c.on{color:var(--text);border-color:var(--line2)}
.chain .c.cur{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.banner.bug .chain .c.on{color:var(--error-text);border-color:var(--error-line)}
.banner.bug .chain .c.cur{background:var(--error);border-color:var(--error);color:var(--on-accent)}
.banner.fix .chain .c.on{color:var(--ok-text);border-color:var(--ok-line)}
.banner.fix .chain .c.cur{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}

.stage-outer{position:relative;width:100%;overflow:hidden}
.stage{position:absolute;top:0;left:0;transform-origin:0 0;background:var(--stage);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.stage svg{position:absolute;inset:0;overflow:visible}
.stage svg.overlay{pointer-events:none;z-index:3}
.zone-cap{font-family:var(--label-font);font-size:11px;font-weight:600;letter-spacing:calc(.08em + var(--label-tracking));fill:var(--text)}
.zone-div{stroke:var(--line);stroke-width:1}

.edge{fill:none;stroke:var(--line2);stroke-width:1.5;transition:stroke .3s}
.edge.async{stroke-dasharray:5 5}
.edge.done{stroke:var(--faint)}
.edge.active{stroke:var(--accent)}
.edge.async.active{animation:march .8s linear infinite}
.edge.new{stroke:var(--ok-line)}.edge.new.done{stroke:var(--ok-line)}.edge.new.active{stroke:var(--ok)}
.edge.mod{stroke:var(--mod-line)}.edge.mod.done{stroke:var(--mod-line)}.edge.mod.active{stroke:var(--mod)}
.edge.err.done{stroke:var(--error-line)}.edge.err.active{stroke:var(--error)}
@keyframes march{to{stroke-dashoffset:-10}}
.elab rect{fill:var(--stage)}
.elab text{fill:var(--faint);font-size:11.5px;transition:fill .3s}
.elab.done text{fill:var(--muted)}
.elab.active text{fill:var(--text);font-weight:600}
.elab.new text{fill:var(--ok)}.elab.mod text{fill:var(--mod)}
.elab.err.active text{fill:var(--error)}
.pk rect{fill:var(--surface);stroke-width:1.2}
.pk text{font-size:11.5px;font-weight:600}

.node{position:absolute;display:flex;flex-direction:column;overflow:hidden;background:var(--node);border:1px solid var(--line);border-radius:calc(var(--radius) - 2px);padding:8px 10px;line-height:1.3;transition:border-color .3s,box-shadow .3s,background .3s,opacity .3s}
.node>*{flex-shrink:0}
.node.active{border-color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.06)}
.node.dead{border-color:var(--error-line);background:var(--error-soft)}
.node.error{border-color:var(--error)}
.node.off{background:var(--soft)}
.node.good{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.node.new{border:1.5px dashed var(--ok)}
.node.mod{border:1.5px dashed var(--mod)}
.node.new.active,.node.mod.active{border-style:solid}
.node .type{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap;min-width:0}
.node .tn{flex-shrink:0}
.node.has-badge .tn{display:none}   /* with a badge only the colour dot shows the type */
.node .type::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.node .label{font-weight:600;font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .sub{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .w{margin-top:4px}
.node .line{margin-top:auto;padding-top:2px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .badge{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;font-weight:600;color:var(--muted);background:var(--chip);border-radius:4px;padding:0 6px}
.node .badge:empty{display:none}
.node .badge.bad{color:var(--error-text);background:var(--error-soft)}.node .badge.ok{color:var(--ok-text);background:var(--ok-soft)}.node .badge.strong{color:var(--on-accent);background:var(--text)}
.node .mline{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slots-more{font-size:11px;color:var(--text);font-weight:600;margin-right:8px}
.tone-bad{color:var(--error);font-weight:600}
.tone-ok{color:var(--ok);font-weight:600}
.tone-strong{color:var(--text);font-weight:600}
.pill{font-size:10.5px;font-weight:600;padding:0 6px;border-radius:4px}
.pill.new{background:var(--ok-soft);color:var(--ok-text)}.pill.mod{background:var(--mod-soft);color:var(--mod-text)}
.pill.test{background:var(--chip);color:var(--muted)}.pill.error{background:var(--error-soft);color:var(--error-text)}
.slot{display:inline-block;width:14px;height:10px;border-radius:2px;background:var(--text);margin-right:4px;vertical-align:-1px;animation:pop .3s ease-out}
.slot:last-of-type{margin-right:8px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

.tasks{display:grid;gap:1px}
.task{display:flex;gap:7px;align-items:center;font-size:12px;line-height:16px;color:var(--faint);white-space:nowrap;overflow:hidden}
.task i{font-style:normal;flex:0 0 13px;height:13px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:9px;line-height:1}
.task.done{color:var(--text)}.task.done i{background:var(--text);border-color:var(--text);color:var(--on-accent)}
.task.fail{color:var(--error);font-weight:600}.task.fail i{background:var(--error);border-color:var(--error);color:var(--on-accent)}
.task.ok{color:var(--ok);font-weight:600}.task.ok i{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.task.skip{color:var(--faint);text-decoration:line-through}.task.skip i{border-style:dashed}

.meter{position:relative;height:7px;border-radius:4px;background:var(--chip);margin:4px 0 3px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--text);transition:width .6s ease,background .3s}
.meter.hi i{background:var(--trigger)}
.meter.over i{background:var(--error)}
.meter.full i{background:var(--ok)}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text)}
.still *{transition:none!important;animation:none!important}

.node.menu .w{flex:1;min-height:0;overflow:hidden;position:relative;margin-top:6px}
.menu{display:flex;flex-direction:column;gap:1px}
.mi{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;font-size:12.5px;line-height:15px;color:var(--body);white-space:nowrap;position:relative}
.mi .ic{flex:0 0 14px;height:14px;border-radius:4px;background:var(--line)}
.mi .ic.back{background:none;color:var(--muted);font-size:13px;display:grid;place-items:center}
.mi .mt{overflow:hidden;text-overflow:ellipsis}
.mi .chev{margin-left:auto;color:var(--faint);font-size:12px}
.mi.app .chev{color:var(--text);font-weight:700}
.mi.child{padding-left:30px;font-size:12px;color:var(--muted)}
.mi.back{color:var(--muted);border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;margin-bottom:3px;font-size:12px}
.mi.active{background:var(--chip);color:var(--text);font-weight:600}
.mi.active::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;border-radius:2px;background:var(--text)}
.mi.ok.active::before{background:var(--ok)}
.mi.bad{color:var(--error)}
.mi .mnote{font-size:10.5px;color:var(--ok);font-weight:600}
.mi.bad .mnote{color:var(--error)}
.mi.cursor{box-shadow:inset 0 0 0 2px var(--step);animation:pulse 1.2s ease-in-out infinite}
.mi.cursor .chev{visibility:hidden}
.mi.cursor::after{content:var(--click,"Click");position:absolute;right:6px;font-size:9.5px;font-weight:700;color:var(--on-accent);background:var(--step);padding:0 5px;border-radius:3px;line-height:14px}
@keyframes pulse{50%{box-shadow:inset 0 0 0 2px var(--mod-line)}}
.mfade{position:absolute;left:0;right:0;bottom:0;height:52px;background:linear-gradient(transparent,var(--node) 70%);display:flex;align-items:flex-end;justify-content:center;font-size:10.5px;color:var(--muted);padding-bottom:2px}
.menu.slide-r{animation:slideR .35s ease-out}.menu.slide-l{animation:slideL .35s ease-out}
@keyframes slideR{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideL{from{transform:translateX(-28px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.menu.slide-r,.menu.slide-l,.mi.cursor{animation:none}}
.zone-cap.bug{fill:var(--error-text)}.zone-cap.fix{fill:var(--ok-text)}
.node.chat .w{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;overflow:hidden}
.bub{max-width:88%;padding:6px 10px;border-radius:8px;font-size:12.5px;line-height:1.4;color:var(--text);animation:pop .25s ease-out}
.bub.me{align-self:flex-end;background:var(--chip)}
.bub.ai{align-self:flex-start;border:1px solid var(--line)}
.bub.bad{border-color:var(--error);background:var(--error-soft)}
.bub.ok{border-color:var(--ok);background:var(--ok-soft)}
.bub small{display:block;font-size:10.5px;font-weight:600;margin-top:2px}
.bub.bad small{color:var(--error)}.bub.ok small{color:var(--ok)}

.card{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 14px;height:118px;overflow:hidden}
.card .big{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .detail{margin-top:4px;font-size:13.5px;line-height:1.45;color:var(--body);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.err .detail{color:var(--error-text)}
.explain{margin-top:8px;font-size:13.5px;line-height:1.5;color:var(--body)}
.explain summary{cursor:pointer;color:var(--muted);font-size:12.5px;user-select:none;list-style:none}
.explain summary::-webkit-details-marker{display:none}
.explain summary::before{content:"▸ ";font-size:10px}
.explain[open] summary::before{content:"▾ "}
.explain p{margin:6px 0 0;max-width:980px}
.explain p+p{margin-top:4px}
.explain blockquote{margin:6px 0 0;padding-left:10px;border-left:2px solid var(--line2);color:var(--muted);font-style:italic}
.card .no{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.card .big{font-size:16px;font-weight:500;margin-top:2px;letter-spacing:-.01em}
.card.err .big{color:var(--error-text)}
.main{display:block}
@media (min-width:1500px){
  .main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
  .main .card{margin-top:0;height:auto;min-height:150px;padding:12px 14px}
  .main .card .big,.main .card .detail{display:block;-webkit-line-clamp:unset}
  .main .card .detail{margin-top:8px}
}
.bottom{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;margin-top:8px}
.timeline{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.tl{width:22px;height:22px;font-size:11px!important;border-radius:50%;padding:0;font-size:11.5px;color:var(--faint);display:grid;place-items:center}
.tl.done{color:var(--text)}
.tl.cur{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tl.err{border-color:var(--error-line)}
.tl.err.cur{background:var(--error);border-color:var(--error)}
.tl-line{flex:0 0 5px;height:1px;background:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;color:var(--muted);font-size:11.5px}
/* embedded / narrow: hide extras, compact controls */
@media (max-width:820px){
  header p{display:none}
  .controls button{padding:4px 9px;font-size:12px}
  .seg.big button{padding:4px 12px;font-size:12.5px}
  .card{height:132px}.card .big{font-size:14px}.card .detail{font-size:13px;-webkit-line-clamp:4}
  .legend{display:none}
}
@media (max-height:640px){
  .wrap{padding-top:8px}
  header{display:none}
  .legend{display:none}
}
.legend .it{display:flex;gap:7px;align-items:center}
.legend .sw{width:6px;height:6px;border-radius:50%;background:var(--c)}
.legend .sep{width:1px;height:14px;background:var(--line)}
.legend svg{display:block}
.node.colored{border-top:3px solid var(--c)}

/* Demo: a mock of the screen as the leftmost zone of the stage; clicks in it play the steps, arrows leave and reach
   its elements (docs/FORMAT.md#demo) */
#demoLayer{position:absolute;inset:0;pointer-events:none;z-index:2}
.win{position:absolute;pointer-events:auto;border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:0 2px 12px rgba(0,0,0,.07)}
.win .bar{height:26px;display:flex;align-items:center;gap:5px;padding:0 10px;background:var(--soft);border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.win .bar i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--line2)}
.win .bar span{margin-left:6px;overflow:hidden;text-overflow:ellipsis}
.win.phone{border:7px solid #27272a;border-radius:28px}
.win.phone .bar{display:none}
#demoHost{display:block;overflow:auto}
.demo-hint{position:absolute;font-size:12.5px;color:var(--muted);text-align:center}
.edge.demo{stroke-width:1.75}
#topEdges{filter:drop-shadow(0 0 1.5px var(--surface)) drop-shadow(0 0 1.5px var(--surface))}
.fcursor{position:absolute;left:50%;top:60%;width:18px;height:18px;z-index:2;pointer-events:none;opacity:0;transition:left .6s ease,top .6s ease,opacity .2s}
.fcursor.on{opacity:1}
.fcursor::before{content:"";position:absolute;inset:0;background:var(--text);clip-path:polygon(0 0,0 85%,24% 64%,40% 100%,55% 94%,40% 58%,72% 58%)}
.fcursor.tap::after{content:"";position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;border:2px solid var(--step);animation:tap .35s ease-out}
@keyframes tap{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.fatal{border:1px solid var(--error-line);background:var(--error-soft);color:var(--error-text);border-radius:10px;padding:16px 20px;white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="title"></h1><p id="subtitle"></p></header>
  <div class="controls">
    <div class="seg big" id="views"></div>
    <button class="primary" id="play">Play</button>
    <button id="prev">Back</button>
    <button id="next">Next</button>
    <div class="seg right" id="mode"><button data-m="0" class="on">Simple</button><button data-m="1">Technical</button></div>
  </div>
  <div class="banner" id="banner"><div class="head" id="head"></div><div class="chain" id="chain"></div><details class="explain" id="explain"><summary id="explainSum"></summary><div id="explainBody"></div></details></div>
  <div class="main" id="main">
  <div class="stage-outer" id="outer">
    <div class="stage" id="stage">
      <svg id="svg"><defs id="defs"></defs><g id="zones"></g><g id="edges"></g><g id="labels"></g></svg>
      <div id="nodes"></div>
      <div id="demoLayer" hidden>
        <div class="win" id="win"><div class="bar"><i></i><i></i><i></i><span id="demoTitle"></span></div><div id="demoHost"></div><div class="fcursor" id="cursor"></div></div>
        <div class="demo-hint" id="demoHint"></div>
      </div>
      <svg class="overlay" id="overlay"><g id="topEdges"></g><g id="topLabels"></g><g id="packets"></g></svg>
    </div>
  </div>
  <div class="card" id="card"></div>
  </div>
  <div class="bottom"><div class="timeline" id="timeline"></div><div class="legend" id="legend"></div></div>
</div>

__THEME_BLOCK__
<script type="application/json" id="flow-spec">__FLOW_SPEC__</script>
<script>
(() => {
'use strict';

// ---------- Layout (from src/layout.mjs, inserted at build time) ----------
/*__LAYOUT__*/

// ---------- Theme (from src/theme.mjs, inserted at build time) ----------
/*__THEME__*/
// Blocks in the page (the build's own, then any a host added) and messages from the host set the variables. They
// land on <html>, so the demo's shadow root sees them too.
function applyTheme(theme){
  for (const [name, value] of themeDeclarations(theme)) document.documentElement.style.setProperty(name, value);
}

// ---------- State ----------

  for (const [id, p] of Object.entries(patch || {})) {

    for (const k of ['status', 'tone', 'badge', 'badgeTone', 'state', 'meter', 'meterText', 'slots', 'menu']) if (k in p) s[k] = p[k];
    if (p.check === 'reset') s.checks = {};

// ---------- Rendering ----------

function renderLegend(){
  const used = new Set(spec.nodes.filter(visible).map(n => n.type));
  let h = Object.entries(TYPES).filter(([k]) => used.has(k)).map(([k, t]) => `<div class="it"><span class="sw" style="--c:${t.c}"></span>${T.types[k]}</div>`).join('');

const MENU_CHEV = {group:'▸', open:'▾', app:'›'};
function menuHtml(n, s){

    const chev = MENU_CHEV[kind] ? `<span class="chev">${MENU_CHEV[kind]}</span>` : '';

function render(){

  return new Promise(resolve => {
    const len = path.getTotalLength(), dur = 700 + len * 2.4;
    const g = svgEl('g', {}, $('packets'));
    svgEl('circle', {r:5, style:`fill:${color}`}, g);
    let lab = null, w = 0;
    if (label) {
      w = label.length * 6.4 + 14;
      lab = svgEl('g', {class:'pk'}, g);
      svgEl('rect', {x:-w / 2, y:-10, width:w, height:20, rx:5, style:`stroke:${color}`}, lab);
      svgEl('text', {y:4, 'text-anchor':'middle', style:`fill:${color}`}, lab).textContent = label;
    }
    const t0 = performance.now();
    (function tick(now){
      if (id !== run) { g.remove(); return resolve(false); }
      const k = Math.min(1, (now - t0) / dur), pt = path.getPointAtLength(ease(k) * len);
      g.setAttribute('transform', `translate(${pt.x},${pt.y})`);
      if (lab) {   // keep the label inside the stage
        const dx = Math.max(8 - (pt.x - w / 2), 0) + Math.min(W - 8 - (pt.x + w / 2), 0);
        lab.setAttribute('transform', `translate(${dx},-20)`);

}
function packetLabel(s, edgeId){
  if (!s.packet) return null;
  if (typeof s.packet === 'string' || s.packet.simple || s.packet.tech) return tx(s.packet);
  return s.packet[edgeId] ? tx(s.packet[edgeId]) : null;
}

async function runStep(i, id){
  const s = steps[i];
  activeIdx = i; state = stateAt(i, i); render();
  if (!await wait(350, id)) return false;
  for (const e of s.edges || []) {
    const mk = mark.edges[e];
    const color = s.error ? MARKERS.err : mk ? MARKERS[TAGS[mk][0]] : MARKERS.active;
    if (!await animatePacket(edgeEls[e], color, packetLabel(s, e), id)) return false;
  }
  if (!(s.edges || []).length && !await wait(500, id)) return false;
  state = stateAt(i + 1); render();
  return true;
}
function jump(n){
  run++; playing = false; $('packets').innerHTML = ''; $('cursor').classList.remove('on');
  pos = Math.max(0, Math.min(steps.length, n)); activeIdx = pos - 1;
  state = stateAt(pos); render();
}
// Plays up to step `end` (exclusive). The tour moves a cursor to every demo click on the way; a click made by
// hand plays only its own part (playClick).
async function play(end = steps.length, tour = true){
  if (typeof end !== 'number') end = steps.length;
  if (pos >= steps.length) jump(0);
  const id = ++run; playing = true; render();
  while (pos < end) {
    if (tour && demo && steps[pos].on && !await cursorTo(steps[pos].on, id)) return;
    if (!await runStep(pos, id)) return;
    pos++; render();
    if (pos < end && !await wait(spec.pause ?? 1400, id)) return;
  }
  playing = false; $('cursor').classList.remove('on'); render();
}

// ---------- Demo (docs/FORMAT.md, "demo") ----------
// The mock lives in a shadow root so that its CSS and the viewer's never meet. Steps with `on` start where the user
// clicks; `demo` on a step sets the mock's state (data-state on its root), which its own CSS shows.
const DEMO_BASE = `:host{all:initial;display:block;height:100%;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#18181b}
*{box-sizing:border-box}.ipai-root{position:relative;height:100%;overflow:hidden}
.ipai-on{cursor:pointer}
.ipai-hot{outline:2px solid var(--mod);outline-offset:2px;animation:ipai-pulse 1.2s ease-in-out infinite}
.ipai-act{outline:2px solid var(--accent);outline-offset:2px}
@keyframes ipai-pulse{50%{outline-color:var(--mod-line)}}
:host(.still) *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){.ipai-hot{animation:none}}
`;
const demoHost = $('demoHost'), demoRoot = demoHost.attachShadow ? demoHost.attachShadow({mode:'open'}) : null;
let demo = null, demoEl = null, demoState = null, seenBoxes = {};
const waitsForClick = () => !!demo && steps.some(s => s.on);
const segEnd = i => { let j = i + 1; while (j < steps.length && !steps[j].on) j++; return j; };
function buildDemo(){
  demo = demoOf(spec, view);
  demoEl = null; demoState = null; seenBoxes = {};
  if (!demo || !demoRoot) return;
  demoHost.classList.toggle('still', document.body.classList.contains('still'));
  $('demoTitle').textContent = tx(demo.title);
  demoRoot.innerHTML = `<style>${DEMO_BASE}${demo.css || ''}</style><div class="ipai-root">${demo.html || ''}</div>`;
  demoEl = demoRoot.querySelector('.ipai-root');
}
const demoTargets = on => demoEl ? [...demoEl.querySelectorAll('[data-ipai]')].filter(el => el.dataset.ipai === on) : [];
function renderDemo(cur){
  if (!demoEl) return;
  // The state after the last step reached; a step's change lands with its packet, a click's at once (the screen reacts
  // before the server answers)
  let st = demo.state || '';
  const upto = Math.min(steps.length, pos + (activeIdx === pos && steps[pos] && steps[pos].on ? 1 : 0));
  for (let j = 0; j < upto; j++) if (steps[j].demo != null) st = steps[j].demo || '';
  demoEl.dataset.state = st;
  if (st !== demoState) { demoState = st; relayoutDemo(); }
  const hot = !playing && pos < steps.length ? steps[pos].on : null;
  // The elements the playing step's arrows leave or reach light up with it
  const touched = new Set(playing && cur ? (cur.edges || []).flatMap(id => EDGES[id] ? [EDGES[id].from, EDGES[id].to] : []) : []);
  for (const el of demoEl.querySelectorAll('[data-ipai]')) {
    const id = el.dataset.ipai;
    el.classList.toggle('ipai-on', steps.some(s => s.on === id));
    el.classList.toggle('ipai-hot', id === hot);
    el.classList.toggle('ipai-act', !!cur && playing && (cur.on === id || touched.has('@' + id)));
  }
  $('demoHint').textContent = !waitsForClick() ? '' : playing ? T.running : pos >= steps.length ? T.again : pos ? T.clickNext : T.tryIt;
}
// The same button can come up again (send fails, then works): a click plays the next part it starts from here on,
// and from the beginning once none is left
function playClick(on){
  const next = steps.findIndex((s, j) => j >= pos && s.on === on);
  const i = next >= 0 ? next : steps.findIndex(s => s.on === on);
  if (i < 0) return;
  jump(i); play(segEnd(i), false);
}
if (demoRoot) demoRoot.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('[data-ipai]');
  if (!el) return;
  e.preventDefault();
  playClick(el.dataset.ipai);
});
// Elements move when the mock changes (a sidebar folds): their arrows follow once the move is over
if (demoRoot) demoRoot.addEventListener('transitionend', () => relayoutDemo());
// Measures where the arrows' elements sit on the stage and routes their arrows there. An element that is not shown
// right now is reached at the window's edge.
function relayoutDemo(){
  if (!demoEl || !DEMO_RECT) return;
  const sr = $('stage').getBoundingClientRect(), s = sr.width / W || 1, boxes = {};
  for (const e of spec.edges) for (const id of [e.from, e.to]) {
    if (!isDemoEnd(id) || boxes[id]) continue;
    const el = demoTargets(id.slice(1))[0], at = r => ({x:(r.left - sr.left) / s, y:(r.top - sr.top) / s, w:r.width / s, h:r.height / s});
    const r = el && el.getBoundingClientRect();
    // A hint that disappeared once its answer landed keeps its arrow where it was; one never seen (a step opened
    // directly) is reached at its nearest visible container, e.g. the input bar of a hidden button
    if (r && r.width) seenBoxes[id] = at(r);
    let box = seenBoxes[id];
    for (let a = el && el.parentElement; !box && a && a !== demoEl; a = a.parentElement) {
      const ar = a.getBoundingClientRect();
      if (ar.width) box = at(ar);
    }
    boxes[id] = box || {x:DEMO_RECT.x + DEMO_RECT.w - 24, y:DEMO_RECT.y + DEMO_RECT.h / 2 - 10, w:20, h:20};
  }
  const routes = computeLayout(spec, view.id, boxes).routes;
  for (const e of spec.edges) if (routes[e.id] && routes[e.id].demo && edgeEls[e.id]) {
    ROUTES[e.id] = routes[e.id]; edgeEls[e.id].setAttribute('d', routes[e.id].d);
  }
  render();
}
// Tour: the cursor glides to the element and taps it
async function cursorTo(on, id){
  const el = demoTargets(on)[0], c = $('cursor');
  if (!el) return true;
  el.scrollIntoView && el.scrollIntoView({block:'nearest', inline:'nearest'});
  const win = $('win').getBoundingClientRect(), r = el.getBoundingClientRect();
  c.classList.add('on');
  c.style.left = r.left - win.left + r.width / 2 + 'px'; c.style.top = r.top - win.top + r.height / 2 + 'px';
  if (!await wait(700, id)) return false;
  c.classList.remove('tap'); void c.offsetWidth; c.classList.add('tap');
  return wait(250, id);
}
const pause = () => jump(pos);
async function next(){
  if (pos >= steps.length) return;
  jump(pos); const id = run;
  if (await runStep(pos, id)) { pos++; render(); }
}

// ---------- Views and controls ----------
function selectView(v){
  view = v; steps = v.steps || [];
  buildStage(v.id); buildDemo();
  mark ={nodes: (v.mark && v.mark.nodes) || {}, edges: (v.mark && v.mark.edges) || {}};
  [...$('views').children].forEach(b => b.classList.toggle('on', b.dataset.v === v.id));
  renderTexts(); jump(0); fit();
}
spec.views.forEach(v => {
  const b = document.createElement('button');
  b.dataset.v = v.id; b.textContent = tx(v.label) || v.id; b.className = v.kind || '';
  b.onclick = () => { if (v !== view) { selectView(v); if (!waitsForClick()) setTimeout(play, 400); } };
  $('views').appendChild(b);
});
$('views').hidden = spec.views.length < 2;
$('mode').hidden = !hasTech;
$('mode').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  mode = +b.dataset.m; [...$('mode').children].forEach(x => x.classList.toggle('on', x === b));
  [...$('views').children].forEach(x => x.textContent = tx(spec.views.find(v => v.id === x.dataset.v).label) || x.dataset.v);
  renderTexts(); render();
};
$('play').onclick = () => playing ? pause() : play();
$('next').onclick = next;
$('prev').onclick = () => jump(pos - 1);
document.addEventListener('keydown', e => {
  if (/^(BUTTON|INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName || '') && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') jump(pos - 1);
});
// The diagram always uses the full width. It is not shrunk by height: when embedded (e.g. in a chat) the window
// height is unknown or grows with the content, so the diagram would become needlessly small.
const fit = () => {
  const outer = $('outer');
  const s = Math.max(.3, Math.min(1.15, outer.clientWidth / W));
  const left = Math.max(0, (outer.clientWidth - W * s) / 2);
  $('stage').style.transform = `translateX(${left}px) scale(${s})`;
  outer.style.height = H * s + 'px';
  if (typeof relayoutDemo === 'function') relayoutDemo();
};
let lastW = 0;
new ResizeObserver(() => { if ($('outer').clientWidth !== lastW) { lastW = $('outer').clientWidth; fit(); } }).observe($('outer'));
window.addEventListener('resize', fit); fit();
$('explain').addEventListener('toggle', fit);
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.has('still')) document.body.classList.add('still');
if (hash.get('mode') === 'tech' && hasTech) $('mode').children[1].click();
selectView(spec.views.find(v => v.id === hash.get('view')) || spec.views[0]);
if (hash.has('step')) jump(+hash.get('step'));
else if (spec.autoplay !== false && !waitsForClick()) setTimeout(play, 700);
})();
</script>
